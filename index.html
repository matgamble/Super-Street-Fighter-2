<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0A1A">
<meta name="description" content="Specials und Trainingsplan für alle 16 Charaktere aus Super Street Fighter II (SNES) – passt ohne Scrollen auf den zweiten Screen.">
<meta name="mobile-web-app-capable" content="yes">
<title>SSF II Specials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">

<style>
:root{
  --ground:#0C0A1A;
  --panel:#171232;
  --panel-hi:#221A47;
  --line:#3A2E6E;
  --line-soft:#2A2154;
  --gold:#FFB627;
  --gold-deep:#C77E00;
  --text:#EDE9FF;
  --muted:#9C93C7;

  --btn-y:#3FBF6A;
  --btn-x:#4A8CFF;
  --btn-l:#B7B0D6;
  --btn-b:#FFC93C;
  --btn-a:#FF4D5E;
  --btn-r:#B7B0D6;
}

*{box-sizing:border-box}

html,body{height:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:"Barlow Semi Condensed","Roboto Condensed",system-ui,sans-serif;
  line-height:1.3;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}

.app{
  height:100vh; height:100dvh;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- Kopfzeile ---------- */
.bar{
  flex:none;
  display:flex; align-items:stretch; gap:4px;
  padding:4px 5px 0;
}
.bar button{
  appearance:none; font:inherit; cursor:pointer;
  background:var(--panel); color:var(--text);
  border:1px solid var(--line-soft); border-radius:8px;
  padding:0 8px; line-height:1;
  user-select:none;
}
.bar button:active{background:var(--panel-hi)}
.bar button:focus-visible{outline:2px solid var(--gold); outline-offset:1px}
.step{flex:none; width:34px; font-size:18px; font-weight:700; color:var(--gold)}
.who{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding:6px 8px;
  border-color:var(--line);
  background:linear-gradient(90deg,var(--panel-hi),var(--panel));
}
.who b{
  font-family:Anton,Impact,sans-serif; font-weight:400;
  font-size:17px; letter-spacing:.02em; text-transform:uppercase;
  color:var(--gold); text-shadow:1px 1px 0 var(--gold-deep);
  transform:skewX(-8deg);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.who .flag{font-size:14px}
.who .caret{font-size:9px; color:var(--muted)}
.icon{flex:none; width:34px; font-size:14px; color:var(--muted)}

/* ---------- Reiter ---------- */
.tabs{
  flex:none;
  display:flex; gap:4px;
  padding:4px 5px;
}
.tabs button{
  appearance:none; font:inherit; cursor:pointer;
  flex:1 1 0; min-width:0;
  background:transparent; color:var(--muted);
  border:1px solid var(--line-soft); border-radius:8px;
  padding:5px 4px;
  font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  user-select:none;
}
.tabs button[aria-pressed="true"]{
  background:var(--gold); color:#241700; border-color:var(--gold);
}
.tabs button:focus-visible{outline:2px solid var(--gold); outline-offset:1px}

/* ---------- Bühne: skaliert sich selbst, damit nichts scrollt ---------- */
.stage{
  flex:1 1 auto; min-height:0;
  overflow:hidden;
  padding:0 5px 5px;
  --u:calc(var(--fs,1) * 16px);
  font-size:var(--u);
}
.stage.overflowing{overflow-y:auto}
/* Sparmodus: Wird der Inhalt sonst unlesbar klein, weicht der Fließtext
   den Eingaben. Trainingskarten behalten ihn, dort ist er der Inhalt. */
.stage.tight .card:not(.drill) .card-note{display:none}
.stage.tight .card{padding:.4em .45em; gap:.3em}
.stage.tight .grid{gap:.3em}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(11em,1fr));
  gap:.4em;
  align-content:start;
}

/* ---------- Karten ---------- */
.card{
  min-width:0;
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:.55em;
  padding:.5em .6em;
  display:flex; flex-direction:column; gap:.4em;
}
.card-head{display:flex; align-items:baseline; gap:.35em; flex-wrap:wrap}
.card-title{font-size:1em; font-weight:700; line-height:1.15}
.card-sub{font-size:.72em; color:var(--muted); font-weight:500}
.card-note{margin:0; font-size:.78em; color:var(--muted)}

/* Eingabe-Sequenz */
.seq{
  display:flex; flex-wrap:wrap; align-items:center; gap:.22em;
  background:#0E0B22;
  border:1px solid var(--line-soft);
  border-radius:.45em;
  padding:.3em .32em;
}
.dir{
  width:calc(var(--u) * 1.5); height:calc(var(--u) * 1.5); flex:none;
  display:grid; place-items:center;
  border-radius:.32em;
  background:var(--panel-hi);
  border:1px solid var(--line);
}
.dir svg{
  width:calc(var(--u) * .95); height:calc(var(--u) * .95);
  fill:none; stroke:var(--text);
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;
}
.charge{
  display:flex; align-items:center; gap:.25em;
  padding:.14em .28em .14em .14em;
  border-radius:.4em;
  background:rgba(255,77,61,.13);
  border:1px solid rgba(255,77,61,.5);
}
.charge .dir{background:rgba(255,77,61,.18); border-color:rgba(255,77,61,.45)}
.charge .dir svg{stroke:#FF8E7F}
.charge span{font-size:.64em; font-weight:700; color:#FF9C8E; white-space:nowrap}
.seq .op{color:var(--muted); font-weight:700; font-size:.82em}
.motion{
  font-weight:700; font-size:.74em;
  padding:.3em .45em; border-radius:.4em;
  background:var(--panel-hi); border:1px solid var(--line);
}
.btns{display:flex; align-items:center; gap:.18em}
.keys{display:flex; align-items:center; gap:.13em}
.key{
  width:calc(var(--u) * 1.35); height:calc(var(--u) * 1.35); flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  font-family:Anton,Impact,sans-serif; font-weight:400;
  font-size:calc(var(--u) * .8);
  color:#0C0A1A;
  border:1px solid rgba(0,0,0,.35);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset;
}
.key.shoulder{border-radius:.35em; width:calc(var(--u) * 1.6); height:calc(var(--u) * 1.05); font-size:calc(var(--u) * .68)}
.key.y{background:var(--btn-y)} .key.x{background:var(--btn-x)} .key.l{background:var(--btn-l)}
.key.b{background:var(--btn-b)} .key.a{background:var(--btn-a)} .key.r{background:var(--btn-r)}
.cap{font-size:.6em; font-weight:700; letter-spacing:.05em; color:var(--muted); text-transform:uppercase}
.tag-all{
  font-size:.55em; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:#241700; background:var(--gold); padding:.14em .3em; border-radius:.3em;
}

/* ---------- Training ---------- */
.strength{
  grid-column:1 / -1;
  display:flex; align-items:baseline; gap:.45em; flex-wrap:wrap;
  padding:.4em .6em;
  border-radius:.5em;
  border:1px solid var(--line);
  border-left:.25em solid var(--gold);
  background:linear-gradient(90deg,var(--panel-hi),var(--panel) 70%);
}
.strength b{
  font-size:.62em; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold);
}
.strength span{font-size:.85em}
.drill{border-left:.18em solid var(--line)}
.drill .num{
  flex:none;
  display:grid; place-items:center;
  width:calc(var(--u) * 1.25); height:calc(var(--u) * 1.25);
  border-radius:50%;
  background:var(--gold); color:#241700;
  font-family:Anton,Impact,sans-serif; font-weight:400;
  font-size:calc(var(--u) * .72);
}
.drill .card-head{flex-wrap:nowrap; align-items:flex-start; gap:.4em}
.drill .card-title{font-size:.9em}
.drill .card-note{font-size:.8em; color:var(--text)}
.use{display:flex; flex-direction:column; gap:.15em}
.use-label{
  font-size:.6em; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--gold);
}
.drill .seq{padding:.24em .26em; gap:.18em}
.drill .seq .cap{display:none}
.drill .dir{width:calc(var(--u) * 1.2); height:calc(var(--u) * 1.2)}
.drill .dir svg{width:calc(var(--u) * .78); height:calc(var(--u) * .78)}
.drill .key{width:calc(var(--u) * 1.1); height:calc(var(--u) * 1.1); font-size:calc(var(--u) * .66)}
.drill .key.shoulder{width:calc(var(--u) * 1.3); height:calc(var(--u) * .86); font-size:calc(var(--u) * .56)}
.drill .charge span{font-size:.58em}
.drill .motion{font-size:.66em; padding:.24em .36em}

/* ---------- Tastenbelegung ---------- */
.keyrow{display:flex; align-items:center; gap:.45em}
.keyrow span{font-size:.85em}
.keyrow em{font-style:normal; color:var(--muted); font-size:.75em}
.legend-card{gap:.5em}
.legend-card p{margin:0; font-size:.78em; color:var(--muted)}
.legend-card p b{color:var(--text); font-weight:600}

/* ---------- Charakter-Auswahl (Vollbild) ---------- */
.sheet{
  position:fixed; inset:0; z-index:50;
  display:flex; flex-direction:column;
  background:rgba(8,6,20,.97);
  padding:6px calc(6px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
  padding-top:calc(6px + env(safe-area-inset-top));
}
.sheet[hidden]{display:none}
.sheet-head{
  flex:none; display:flex; align-items:center; gap:6px;
  padding:2px 2px 6px;
  font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted);
}
.sheet-head button{
  appearance:none; font:inherit; cursor:pointer; margin-left:auto;
  background:var(--panel); color:var(--text);
  border:1px solid var(--line-soft); border-radius:8px;
  padding:4px 10px; font-size:12px;
}
.sheet-grid{
  flex:1 1 auto; min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;
  gap:5px;
}
.chip{
  appearance:none; font:inherit; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  min-width:0; padding:2px;
  background:var(--panel); color:var(--text);
  border:1px solid var(--line-soft); border-radius:9px;
  font-weight:600; font-size:12px; line-height:1.1; text-align:center;
}
.chip .flag{font-size:15px; line-height:1}
.chip .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.chip[aria-pressed="true"]{
  background:var(--gold); color:#241700; border-color:var(--gold);
}
.chip:focus-visible{outline:2px solid var(--gold); outline-offset:1px}

@media (prefers-reduced-motion:no-preference){
  .grid>*{animation:rise .2s ease-out both; animation-delay:calc(var(--i,0) * 30ms)}
}
@keyframes rise{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <button class="step" id="prev" aria-label="Vorheriger Charakter">‹</button>
    <button class="who" id="who" aria-label="Charakter wählen">
      <span class="flag" id="who-flag">🇯🇵</span><b id="who-name">Ryu</b><span class="caret">▼</span>
    </button>
    <button class="step" id="next" aria-label="Nächster Charakter">›</button>
    <button class="icon" id="fs" aria-label="Vollbild">⛶</button>
  </div>

  <div class="tabs" role="tablist">
    <button data-tab="specials" aria-pressed="true">Specials</button>
    <button data-tab="training" aria-pressed="false">Training</button>
    <button data-tab="keys" aria-pressed="false">Tasten</button>
  </div>

  <div class="stage" id="stage"><div class="grid" id="view"></div></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <span>Charakter wählen</span>
    <button id="sheet-close">Schließen</button>
  </div>
  <div class="sheet-grid" id="sheet-grid"></div>
</div>

<script>
/* =========================================================================
   Daten
   Eingaben als Token-Liste:
     D("f|b|u|d|uf|df|ub|db")  Richtung
     C("b|d|…")                Richtung halten (Ladebewegung)
     M("Text")                 Bewegung als Text, z. B. 360° Kreis
     K("P|K|PPP|KKK")          Knöpfe
     T("Text")                 freier Zusatz
   ========================================================================= */

const D = d => ({d});
const C = d => ({c:d});
const K = k => ({k});
const M = m => ({m});
const T = t => ({t});

const ROSTER = [
  {group:"Die acht Originale", chars:[

    {id:"ryu", name:"Ryu", flag:"🇯🇵", land:"Japan", style:"Ansatsuken",
     strength:"Der Maßstab: Der Feuerball zwingt zu einer Reaktion, der Shoryuken bestraft sie.",
     moves:[
       {n:"Hadoken", jp:"Feuerball", seq:[D("d"),D("df"),D("f"),K("P")],
        note:"Y fliegt langsam, L schnell. Grundlage für alles."},
       {n:"Shoryuken", jp:"Drachenfaust", seq:[D("f"),D("d"),D("df"),K("P")],
        note:"Der Konter gegen Sprünge. Beim Start unverwundbar, danach fällt Ryu ungeschützt."},
       {n:"Tatsumaki Senpukyaku", jp:"Hurricane Kick", seq:[D("d"),D("db"),D("b"),K("K")],
        note:"Geht auch im Sprung und bringt Ryu schnell durch den Screen."}
     ],
     drills:[
       {n:"Takt brechen", t:"Zehn Feuerbälle mit bewusst ungleichen Pausen – mal sofort, mal nach zwei Sekunden. Wer immer im selben Takt wirft, wird übersprungen.", use:["Hadoken"]},
       {n:"Sprung abfangen", t:"Nur Feuerball werfen und warten. Sobald der Gegner abspringt: Shoryuken. Ziel sind zehn saubere Treffer hintereinander.", use:["Shoryuken"]},
       {n:"Nach dem Sprung weitermachen", t:"Sprungkick, landen, geduckter schwacher Kick, Feuerball. Der Sprung ist der Anfang einer Folge, nicht das Ende.", use:["Hadoken"]}
     ]},

    {id:"honda", name:"E. Honda", flag:"🇯🇵", land:"Japan", style:"Sumo",
     strength:"Ladung im Blocken aufbauen, auf Tuchfühlung explodieren.",
     moves:[
       {n:"Hundred Hand Slap", jp:"Hyakuretsu Harite", seq:[K("P"),T("mehrfach schnell tippen")],
        note:"Punch-Knopf hämmern. Bricht die Deckung auf kurze Distanz auf."},
       {n:"Sumo Headbutt", jp:"Sumo Kopfstoß", seq:[C("b"),D("f"),K("P")],
        note:"Rammt quer über den Screen. Y kurz, L über die volle Distanz."},
       {n:"Sumo Smash", jp:"Sumo Splash", seq:[C("d"),D("u"),K("K")],
        note:"Springt hoch und landet mit dem Hintern – gut gegen Gegner, die unten campen."}
     ],
     drills:[
       {n:"Ladung im Blocken", t:"Eine Runde nur rückwärts blocken – die Ladung läuft dabei mit. Nach jedem geblockten Angriff einen Headbutt herauslassen.", use:["Sumo Headbutt"]},
       {n:"Handschlag nur in Reichweite", t:"Hundred Hand Slap ausschließlich direkt am Gegner. Das Gefühl für „nah genug\" ist die eigentliche Übung.", use:["Hundred Hand Slap"]},
       {n:"Über den Ducker", t:"Sumo Smash gegen einen Gegner, der unten blockt. Trainiert die zweite Ladung nach unten parallel zur ersten.", use:["Sumo Smash"]}
     ]},

    {id:"blanka", name:"Blanka", flag:"🇧🇷", land:"Brasilien", style:"Wildkampf",
     strength:"Unberechenbar: Elektro von unten, die Rolle als Konter.",
     moves:[
       {n:"Rolling Attack", jp:"Rolling Ball", seq:[C("b"),D("f"),K("P")],
        note:"Die Kugel nach vorn. Geblockt ist sie unsicher – nicht blind spammen."},
       {n:"Backstep Roll", jp:"Rückwärtsrolle", seq:[C("b"),D("f"),K("K")],
        note:"Neu in Super: rollt erst zurück, dann nach vorn. Gut gegen Feuerbälle."},
       {n:"Vertical Rolling", jp:"Up Ball", seq:[C("d"),D("u"),K("K")],
        note:"Senkrecht nach oben – Blankas Anti-Air."},
       {n:"Electric Thunder", jp:"Denkou Ball", seq:[K("P"),T("mehrfach schnell tippen")],
        note:"Trifft direkt vor Blanka und schlägt Sprünge aus der Luft."}
     ],
     drills:[
       {n:"Rolle nur als Antwort", t:"Rolling Attack ausschließlich, wenn der Gegner einen Feuerball wirft. Blind gerollt heißt geblockt und bestraft.", use:["Rolling Attack"]},
       {n:"Elektro als Dach", t:"Den Gegner anspringen lassen und Electric Thunder auslösen, bevor er landet. Knopf hämmern, nicht drücken.", use:["Electric Thunder"]},
       {n:"Rückwärts denken", t:"Backstep Roll üben, bis er als Ausweichmanöver sitzt: erst zurück aus der Gefahr, dann hinein.", use:["Backstep Roll"]}
     ]},

    {id:"guile", name:"Guile", flag:"🇺🇸", land:"USA", style:"Military Martial Arts",
     strength:"Geduld: Sonic Boom hält vorn frei, der Flash Kick hält oben frei.",
     moves:[
       {n:"Sonic Boom", jp:"Schallwelle", seq:[C("b"),D("f"),K("P")],
        note:"Lädt sich beim Ducken mit auf – Guile spielt fast komplett aus der Hocke."},
       {n:"Somersault Kick", jp:"Flash Kick", seq:[C("d"),D("u"),K("K")],
        note:"Der klassische Anti-Air. Ladung halten, bis der Gegner springt."}
     ],
     drills:[
       {n:"Eine Runde in der Hocke", t:"Geduckt-rückwärts sitzen bleiben und nur Sonic Boom werfen. Beide Ladungen laufen dabei gleichzeitig mit.", use:["Sonic Boom"]},
       {n:"Hinter dem Boom herlaufen", t:"Boom werfen und sofort hinterhergehen. Der Gegner muss blocken – dann Wurf oder tiefer Kick.", use:["Sonic Boom"]},
       {n:"Flash Kick nur auf Sprünge", t:"Zehn Sprünge des Gegners abfangen, ohne ein einziges Mal blind zu treten.", use:["Somersault Kick"]}
     ]},

    {id:"ken", name:"Ken", flag:"🇺🇸", land:"USA", style:"Ansatsuken",
     strength:"Nahkampf: Kens starker Shoryuken macht den meisten Schaden im Spiel.",
     moves:[
       {n:"Hadoken", jp:"Feuerball", seq:[D("d"),D("df"),D("f"),K("P")],
        note:"Wie bei Ryu, minimal langsamer – Ken lebt vom Nahkampf."},
       {n:"Shoryuken", jp:"Drachenfaust", seq:[D("f"),D("d"),D("df"),K("P")],
        note:"Kens Markenzeichen: die L-Version trifft mehrfach und macht deutlich mehr Schaden."},
       {n:"Tatsumaki Senpukyaku", jp:"Hurricane Kick", seq:[D("d"),D("db"),D("b"),K("K")],
        note:"Auch in der Luft. Schließt schnell Distanz."}
     ],
     drills:[
       {n:"Drachenfaust aus dem Lauf", t:"Vorwärtsgehen, dann sofort die Drachenfaust-Eingabe mit starkem Punch. Ohne Anlauf, ohne Vorbereitung – zehnmal sauber.", use:["Shoryuken"]},
       {n:"Sprung rein, Faust raus", t:"Sprungkick, landen, sofort Shoryuken. Das ist Kens größtes Schadensfenster.", use:["Shoryuken"]},
       {n:"Eckendruck", t:"Gegner in die Ecke drängen, dann abwechseln zwischen tiefem Kick und Wurf. Nie zweimal dasselbe hintereinander."}
     ]},

    {id:"chunli", name:"Chun-Li", flag:"🇨🇳", land:"China", style:"Chinesisches Kung Fu",
     strength:"Tempo: die schnellsten Beine im Spiel – und zwei Ladungen gleichzeitig.",
     moves:[
       {n:"Kikoken", jp:"Energieball", seq:[C("b"),D("f"),K("P")],
        note:"Neu in Super: endlich ein eigenes Geschoss, fliegt aber nicht über den ganzen Screen."},
       {n:"Spinning Bird Kick", jp:"Hazan Tenshou Kyaku", seq:[C("d"),D("u"),K("K")],
        note:"Dreht waagerecht durch die Luft und trifft mehrfach."},
       {n:"Hyakuretsukyaku", jp:"Lightning Legs", seq:[K("K"),T("mehrfach schnell tippen")],
        note:"Kick-Knopf hämmern. Der schnellste Weg zu viel Schaden aus der Nähe."},
       {n:"Head Stomp", jp:"Sprungtritt", seq:[T("im Sprung"),D("d"),K("K")],
        note:"Springt vom Kopf des Gegners ab – direkt danach nochmal Kick für den Nachschlag."}
     ],
     drills:[
       {n:"Doppelte Ladung", t:"Schräg zurück-unten halten: das lädt Kikoken und Spinning Bird zusammen auf. Abwechselnd auslösen, ohne die Deckung zu verlassen.", use:["Kikoken", "Spinning Bird Kick"]},
       {n:"Beine auf Knopfdruck", t:"Kick-Knopf eine Sekunde lang hämmern, bis die Lightning Legs zuverlässig kommen. Erst dann im Kampf einsetzen.", use:["Hyakuretsukyaku"]},
       {n:"Von oben nerven", t:"Head Stomp und direkt wieder abspringen, ohne zu landen. Der Gegner kommt nicht zum Zug.", use:["Head Stomp"]}
     ]},

    {id:"zangief", name:"Zangief", flag:"🇷🇺", land:"Russland", style:"Wrestling",
     strength:"Ein einziger Griff kann die Runde entscheiden.",
     moves:[
       {n:"Spinning Piledriver", jp:"Screw Piledriver", seq:[M("360° Kreis"),K("P")],
        note:"Direkt am Gegner. Der stärkste Wurf im Spiel."},
       {n:"Flying Power Bomb", jp:"Running Bear Grab", seq:[M("360° Kreis"),K("K")],
        note:"Neu in Super: läuft ein Stück auf den Gegner zu und greift – auch aus mittlerer Distanz."},

const ARROW_ROT = {f:0, df:45, d:90, db:135, b:180, ub:225, u:270, uf:315};
const DIR_LABEL = {f:"vorwärts", df:"schräg vorwärts-unten", d:"unten", db:"schräg zurück-unten",
                   b:"zurück", ub:"schräg zurück-oben", u:"oben", uf:"schräg vorwärts-oben"};
const KEYSETS = {
  P:[["Y","y"],["X","x"],["L","l"]],
  K:[["B","b"],["A","a"],["R","r"]],
  PPP:[["Y","y"],["X","x"],["L","l"]],
  KKK:[["B","b"],["A","a"],["R","r"]]
};

function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html !== undefined) n.innerHTML = html;
  return n;
}

function arrow(dir){
  const n = el("div","dir");
  n.innerHTML = '<svg viewBox="0 0 12 12" aria-hidden="true"><g transform="rotate(' +
    ARROW_ROT[dir] + ' 6 6)"><path d="M1.9 6H9.5"/><path d="M6.3 2.8 9.9 6 6.3 9.2"/></g></svg>';
  n.setAttribute("title", DIR_LABEL[dir]);
  return n;
}

function keyChip(letter, cls){
  const shoulder = (letter === "L" || letter === "R") ? " shoulder" : "";
  return el("b","key " + cls + shoulder, letter);
}

function keyGroup(code){
  const wrap = el("div","btns");
  const keys = el("div","keys");
  KEYSETS[code].forEach(([letter, cls]) => keys.appendChild(keyChip(letter, cls)));
  wrap.appendChild(keys);
  wrap.appendChild(code.length === 3
    ? el("span","tag-all","alle 3")
    : el("span","cap","eine davon"));
  return wrap;
}

function renderSeq(seq){
  const box = el("div","seq");
  seq.forEach((step, i) => {
    if(step.k && i > 0 && !seq[i-1].t) box.appendChild(el("span","op","+"));
    if(step.d) box.appendChild(arrow(step.d));
    if(step.c){
      const ch = el("div","charge");
      ch.appendChild(arrow(step.c));
      ch.appendChild(el("span",null,"ca. 2 Sek. halten"));
      box.appendChild(ch);
    }
    if(step.m) box.appendChild(el("div","motion", step.m));
    if(step.k) box.appendChild(keyGroup(step.k));
    if(step.t) box.appendChild(el("div","motion", step.t));
  });
  return box;
}

function viewSpecials(f){
  return f.moves.map(mv => {
    const card = el("article","card");
    const head = el("div","card-head");
    head.appendChild(el("h2","card-title", mv.n));
    head.appendChild(el("span","card-sub", mv.jp));
    card.appendChild(head);
    card.appendChild(renderSeq(mv.seq));
    if(mv.seq2) card.appendChild(renderSeq(mv.seq2));
    card.appendChild(el("p","card-note", mv.note));
    return card;
  });
}

function viewTraining(f){
  const out = [];
  const s = el("div","strength");
  s.appendChild(el("b",null,"Stärke"));
  s.appendChild(el("span",null, f.strength));
  out.push(s);
  f.drills.forEach((d, i) => {
    const card = el("article","card drill");
    const head = el("div","card-head");
    head.appendChild(el("span","num", String(i + 1)));
    head.appendChild(el("h2","card-title", d.n));
    card.appendChild(head);
    card.appendChild(el("p","card-note", d.t));
    (d.use || []).forEach(ref => {
      const [name, which] = ref.split("#");
      const mv = f.moves.find(m => m.n === name);
      if(!mv) return;
      const seq = which === "2" ? mv.seq2 : mv.seq;
      if(!seq) return;
      const wrap = el("div","use");
      wrap.appendChild(el("span","use-label", mv.n));
      wrap.appendChild(renderSeq(seq));
      card.appendChild(wrap);
    });
    out.push(card);
  });
  return out;
}

const stage = document.getElementById("stage");
const view  = document.getElementById("view");
let currentId = "ryu";
let currentTab = "specials";

function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function render(){
  const f = ALL.find(c => c.id === currentId) || ALL[0];

  document.getElementById("who-name").textContent = f.name;
  document.getElementById("who-flag").textContent = f.flag;

  const nodes = currentTab === "specials" ? viewSpecials(f)
              : currentTab === "training" ? viewTraining(f)
              : viewKeys();

  view.textContent = "";
  nodes.forEach((n, i) => { n.style.setProperty("--i", i); view.appendChild(n); });

  document.querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", String(c.dataset.id === f.id)));
  document.querySelectorAll(".tabs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.tab === currentTab)));

  store("ssf2-fighter", f.id);
  store("ssf2-tab", currentTab);
  fit();
}

/* Skaliert den Inhalt so lange herunter, bis er ohne Scrollen auf den
   Screen passt. Von groß nach klein, damit die erste passende Stufe
   auch die größtmögliche ist. */
const MIN_READABLE = 0.82;

function fit(){
  stage.classList.remove("overflowing", "tight");

  let best = largestFitting();
  if(best === null || best < MIN_READABLE){
    stage.classList.add("tight");
    const tighter = largestFitting();
    if(tighter === null || (best !== null && tighter <= best)){
      stage.classList.remove("tight");
      apply(best);
      return;
    }
    best = tighter;
  }
  apply(best);
}

function largestFitting(){
  const fits = () =>
    stage.scrollHeight <= stage.clientHeight && stage.scrollWidth <= stage.clientWidth;
  for(let s = 1.40; s >= 0.42; s -= 0.03){
    stage.style.setProperty("--fs", s.toFixed(2));
    if(fits()) return s;
  }
  return null;
}

function apply(scale){
  if(scale === null){
    stage.style.setProperty("--fs", "0.42");
    stage.classList.add("overflowing");
  }else{
    stage.style.setProperty("--fs", scale.toFixed(2));
  }
}

function setFighter(id){ currentId = id; render(); }
function stepFighter(delta){
  const i = ALL.findIndex(c => c.id === currentId);
  setFighter(ALL[(i + delta + ALL.length) % ALL.length].id);
}
function setTab(tab){ currentTab = tab; render(); }

    b.dataset.id = c.id;
    b.setAttribute("aria-pressed","false");
    b.innerHTML = '<span class="flag">' + c.flag + '</span><span class="nm">' + c.name + '</span>';
    b.addEventListener("click", () => { setFighter(c.id); closeSheet(); });
    host.appendChild(b);
  });
}
function openSheet(){ sheet.hidden = false; }
function closeSheet(){ sheet.hidden = true; }

document.getElementById("who").addEventListener("click", openSheet);
document.getElementById("sheet-close").addEventListener("click", closeSheet);
document.getElementById("prev").addEventListener("click", () => stepFighter(-1));
document.getElementById("next").addEventListener("click", () => stepFighter(1));
document.querySelectorAll(".tabs button").forEach(b =>
  b.addEventListener("click", () => setTab(b.dataset.tab)));

document.getElementById("fs").addEventListener("click", () => {
  if(document.fullscreenElement) document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(() => {});
});

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && !sheet.hidden){ closeSheet(); return; }
  if(e.key === "ArrowLeft")  stepFighter(-1);
  if(e.key === "ArrowRight") stepFighter(1);
  if(e.key === "1") setTab("specials");
  if(e.key === "2") setTab("training");
  if(e.key === "3") setTab("keys");
});

let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fit, 120);
});
addEventListener("orientationchange", () => setTimeout(fit, 250));

/* =========================================================================
   Start
   ========================================================================= */

buildSheet();
currentId  = recall("ssf2-fighter") || "ryu";
currentTab = recall("ssf2-tab") || "specials";
if(!ALL.some(c => c.id === currentId)) currentId = "ryu";
if(!["specials","training","keys"].includes(currentTab)) currentTab = "specials";
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
